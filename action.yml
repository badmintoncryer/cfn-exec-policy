name: cfn-exec-policy
description: Comment which CloudFormation execution role permissions a pull request adds, and fail on wildcards or unconditioned iam:PassRole.
branding: { icon: shield, color: blue }
inputs:
  path:
    description: cdk.out directory or template files (space-separated), synthesized from the pull request.
    default: cdk.out
  base:
    description: cdk.out (or template) synthesized from the base branch.
    required: true
  fail-on:
    description: Fail when the pull request adds any of wildcard, passrole, unknown or any (comma-separated).
    default: ""
  args:
    description: More flags, e.g. "--pass-role-condition" or "--strict".
    default: ""
  comment:
    description: Post the result as a pull request comment, updated on each run.
    default: "true"
  github-token:
    description: Token used to comment.
    default: ${{ github.token }}
outputs:
  exit-code:
    description: 0 ok, 3 the pull request adds something fail-on names.
    value: ${{ steps.run.outputs.exit-code }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        IN_PATH: ${{ inputs.path }}
        IN_BASE: ${{ inputs.base }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_ARGS: ${{ inputs.args }}
        IN_COMMENT: ${{ inputs.comment }}
        PR: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -f # inputs are split on spaces, never globbed
        # @v1.2.3 runs that npm version, @v1 the latest 1.x; @main or a SHA run the latest.
        version=latest
        if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then version="${ACTION_REF#v}"
        elif [[ "$ACTION_REF" =~ ^v[0-9]+$ ]]; then version="${ACTION_REF#v}"; fi
        flags=(--format md --base "$IN_BASE")
        [ -n "$IN_FAIL_ON" ] && flags+=(--fail-on "$IN_FAIL_ON")
        out="$RUNNER_TEMP/exec-policy.md"
        code=0
        npx -y "cfn-exec-policy@$version" diff "${flags[@]}" $IN_ARGS $IN_PATH > "$out" || code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" = 0 ] || [ "$code" = 3 ]; then
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
        else # replace an earlier result in the comment, so it doesn't look current
          echo "cfn-exec-policy failed (exit $code); see the job log." > "$out"
        fi
        if [ "$IN_COMMENT" = true ] && [ -n "$PR" ]; then
          marker="<!-- cfn-exec-policy -->"
          # GitHub rejects comments over 65536 characters; cut at a line boundary.
          { echo "$marker"; awk '{ n += length($0) + 1; if (n > 60000) { print "\n(truncated; the job summary has it all)"; exit } print }' "$out"; } > "$out.body"
          # A read-only token (pull requests from forks, Dependabot) can't comment: warn, don't fail.
          ids=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id") || ids=""
          id="${ids%%$'\n'*}"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@"$out.body" > /dev/null || posted=no
          else
            gh api "repos/$GH_REPO/issues/$PR/comments" -F body=@"$out.body" > /dev/null || posted=no
          fi
          [ "${posted:-}" = no ] && echo "::warning::cfn-exec-policy could not comment on the pull request (the token may be read-only); the result is in the job summary."
        fi
        exit "$code"
