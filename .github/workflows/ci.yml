name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      # The cdk synth plugin in the npm package, against the binary just built.
      - run: go build -o /tmp/cfn-exec-policy . && CFN_EXEC_POLICY_BINARY=/tmp/cfn-exec-policy node --test npm/cfn-exec-policy/test/plugin.test.js
