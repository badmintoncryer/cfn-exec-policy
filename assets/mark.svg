<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="mark-title">
  <title id="mark-title">cfn-exec-policy</title>
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="256" y2="256">
      <stop offset="0" stop-color="#2F4054"/>
      <stop offset="1" stop-color="#18202B"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="176" cy="80" r="150">
      <stop offset="0" stop-color="#FF9900" stop-opacity=".26"/>
      <stop offset="1" stop-color="#FF9900" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheet" gradientUnits="userSpaceOnUse" x1="40" y1="200" x2="220" y2="30">
      <stop offset="0" stop-color="#FF8A00"/>
      <stop offset="1" stop-color="#FFC24D"/>
    </linearGradient>
    <linearGradient id="clip" gradientUnits="userSpaceOnUse" x1="120" y1="230" x2="230" y2="40">
      <stop offset="0" stop-color="#B85C05"/>
      <stop offset="1" stop-color="#E8890C"/>
    </linearGradient>
  </defs>
  <g>
    <rect width="256" height="256" rx="60" fill="url(#bg)"/>
    <rect width="256" height="256" rx="60" fill="url(#glow)"/>
    <rect x=".75" y=".75" width="254.5" height="254.5" rx="59.25" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="1.5"/>
    <!-- A policy document: the lines your templates need stay, the rest fade out. -->
    <g transform="rotate(-12 150 118)">
      <rect x="82" y="52" width="140" height="150" rx="18" fill="url(#sheet)"/>
      <rect x="128" y="40" width="48" height="24" rx="8" fill="url(#clip)"/>
      <rect x="102" y="86" width="100" height="12" rx="6" fill="#1B2430"/>
      <rect x="102" y="112" width="70" height="12" rx="6" fill="#1B2430" fill-opacity=".35"/>
      <rect x="102" y="138" width="86" height="12" rx="6" fill="#1B2430"/>
      <rect x="102" y="164" width="56" height="12" rx="6" fill="#1B2430" fill-opacity=".35"/>
    </g>
  </g>
</svg>
