# Needs one success signal to the handle URL while the stack is creating (see the run command).
Parameters: { Phase: { Type: String, Default: "1" } }
Resources:
  Handle: { Type: AWS::CloudFormation::WaitConditionHandle }
  Wait:
    Type: AWS::CloudFormation::WaitCondition
    Properties: { Handle: !Ref Handle, Timeout: "900", Count: 1 }
