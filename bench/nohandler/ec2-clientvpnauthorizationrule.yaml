# ap-northeast-1, against the endpoint in supports3-tokyo.yaml. Any change replaces the
# rule, so phase 2 also moves the CIDR (the same CIDR would collide: "Rule already exists").
Parameters: { Phase: { Type: String, Default: "1" } }
Conditions: { Two: !Equals [!Ref Phase, "2"] }
Resources:
  Rule:
    Type: AWS::EC2::ClientVpnAuthorizationRule
    Properties:
      ClientVpnEndpointId: !ImportValue cfnxp-VpnId
      TargetNetworkCidr: !If [Two, 10.99.0.0/16, 172.31.0.0/16]
      AuthorizeAllGroups: true
      Description: !Sub phase ${Phase}
