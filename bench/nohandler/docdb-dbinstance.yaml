Parameters: { Phase: { Type: String, Default: "1" } }
Conditions: { Two: !Equals [!Ref Phase, "2"] }
Resources:
  Instance:
    Type: AWS::DocDB::DBInstance
    Properties:
      DBClusterIdentifier: !ImportValue cfnxp-DocdbCluster
      DBInstanceClass: db.t3.medium
      PreferredMaintenanceWindow: !If [Two, "mon:05:00-mon:05:30", "sun:05:00-sun:05:30"]
