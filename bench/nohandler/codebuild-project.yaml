Parameters: { Phase: { Type: String, Default: "1" } }
Resources:
  Project:
    Type: AWS::CodeBuild::Project
    Properties:
      Description: !Sub phase ${Phase}
      ServiceRole: !ImportValue cfnxp-CodeBuildRoleArn
      Source: { Type: NO_SOURCE, BuildSpec: "version: 0.2\nphases:\n  build:\n    commands:\n      - echo hi\n" }
      Artifacts: { Type: NO_ARTIFACTS }
      Environment: { Type: LINUX_CONTAINER, ComputeType: BUILD_GENERAL1_SMALL, Image: "aws/codebuild/standard:7.0" }
      Tags: [{ Key: phase, Value: !Ref Phase }]
