# Attaches a policy to the pre-created role cfnxp-strict-unbounded.
Resources:
  Policy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles: [cfnxp-strict-unbounded]
      PolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Action: logs:CreateLogGroup, Resource: "*"}]
