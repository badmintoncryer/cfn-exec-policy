# b: phase 2 adds the boundary and changes the inline policy.
Parameters:
  Phase: {Type: String, Default: "1", AllowedValues: ["1", "2"]}
Conditions:
  P2: !Equals [!Ref Phase, "2"]
Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      PermissionsBoundary: !If [P2, !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/cfnxp-mig-boundary", !Ref AWS::NoValue]
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: !If [P2, [logs:CreateLogGroup, logs:CreateLogStream], [logs:CreateLogGroup]]
                Resource: "*"
