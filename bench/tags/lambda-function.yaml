# Tag-change check: phase 1 tags a=1,b=2; phase 2 changes a and drops b; phase 3 drops all tags.
Parameters: { Phase: { Type: String, Default: "1" } }
Conditions:
  One: !Equals [!Ref Phase, "1"]
  Two: !Equals [!Ref Phase, "2"]
  Three: !Equals [!Ref Phase, "3"]
Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
  Fn:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt Role.Arn
      Code: { ZipFile: "def handler(e, c): return 1" }
      Tags: !If [Three, !Ref AWS::NoValue, !If [Two, [{ Key: a, Value: "2" }], [{ Key: a, Value: "1" }, { Key: b, Value: "2" }]]]
